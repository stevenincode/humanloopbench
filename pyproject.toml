[project]
name = "humanloopbench"
version = "0.1.0"
description = "Human-in-the-loop LLM failure detection toolkit + mini-benchmark for grounded QA."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.3.0",
    "pydantic>=2.7",
    "pandas>=2.2",
    "datasets>=2.19",
    "streamlit>=1.36",
    "mcp>=1.0",
    "typer>=0.12",
    "tqdm>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
humanloopbench = "humanloopbench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/humanloopbench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
